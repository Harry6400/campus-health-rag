[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"

[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#176B62"
backgroundColor = "#F7F9FA"
secondaryBackgroundColor = "#F1F5F5"
textColor = "#1C3038"

[theme.dark]
primaryColor = "#72C8B8"
backgroundColor = "#101C22"
secondaryBackgroundColor = "#1B2C34"
textColor = "#E7F0F2"
borderColor = "#3A515B"
